name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `make lock-check` builds Dockerfile.dev and runs
      # `pnpm install --frozen-lockfile` inside it via `docker compose exec`
      # — fails if pnpm-lock.yaml drifted from package.json. Docker-first
      # (issue #53): no actions/setup-node, the runner only needs Docker.
      - name: Verify lockfile is in sync (via Docker)
        run: make lock-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint (via Docker)
        run: make lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Type check (via Docker)
        run: make typecheck

  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test with coverage (via Docker)
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `make build` runs `pnpm build` inside Docker and verifies dist/ is
      # non-empty in the same step.
      - name: Build (via Docker)
        run: make build

  docker-checks:
    name: Docker port-binding checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static CMD/HEALTHCHECK shell-form check
        run: ./scripts/check-docker-cmd-shell-form.sh

      - name: Docker port smoke test
        run: ./scripts/docker-port-smoke-test.sh

  audit-and-docs:
    name: Dependency audit + doc consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Security audit (via Docker)
        run: make audit

      - name: Documentation consistency checks (via Docker)
        run: make check-docs

  docker-image:
    name: Build and scan production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    # Only on push to main: no registry push here, so a PR run would just
    # rebuild+rescan an image that's discarded — the same gate `trivy-fs`
    # would use if it were image-scoped instead of filesystem-scoped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build -f Dockerfile -t dockyard2sail-ts:${{ github.sha }} .

      # Image scan: same HIGH/CRITICAL fail-closed gate as trivy-fs, applied
      # to the built production image instead of the filesystem. Accepted
      # exceptions share the same .trivyignore.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dockyard2sail-ts:${{ github.sha }}
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          exit-code: 1

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Filesystem scan: dependency CVEs + secrets + IaC misconfigurations.
      # Fails the job on HIGH/CRITICAL; accepted exceptions go in .trivyignore.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          exit-code: 1
