services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: typescript-boilerplate:dev
    volumes:
      - .:/app
      - pnpm-store:/home/node/.pnpm-store
      # Shadows the bind mount's node_modules subpath so installed packages
      # stay container-only: avoids native-binary mismatches when the host
      # OS/arch differs from this Linux image, and keeps the host free of
      # Node artifacts (the whole point of running pnpm install in Docker).
      - node_modules:/app/node_modules
    working_dir: /app
    command: sleep infinity
    ports:
      # Host side is overridable (DEV_PORT, shell or .env) so another project
      # already holding 5173 doesn't block `docker compose up` — and with it
      # every Docker-first make target and the pre-push hook, since they all
      # go through `up-d`. The container side stays 5173 (vite.config.ts).
      - "${DEV_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
      # Skip husky's `prepare` in the container: it runs as root against a
      # bind mount owned by the host user, so git rejects /app ("dubious
      # ownership") and husky logs a misleading `fatal: not in a git
      # directory` on every install. Hooks are installed from the host. Not
      # fixed with `safe.directory` on purpose: that would let husky succeed
      # as root and rewrite the host's .git/config (core.hooksPath) and
      # recreate .husky/_ owned by root.
      - HUSKY=0
    # Root, not `node`: the bind mount (.:/app) keeps the *host* directory's
    # ownership, and that owning UID varies by environment — it happens to
    # match the container's `node` user (1000) on a typical single-user
    # Linux dev box, but not on a GitHub Actions runner (actions/checkout
    # writes as the runner user), where pnpm's non-root writes into /app
    # then fail with EACCES. Root sidesteps the UID-matching problem
    # entirely and is the documented exception for a dev container never
    # reachable outside localhost (development-standards.md §1) — this one
    # only ever runs Docker-first `make` targets via `docker compose exec`.
    user: root
    stdin_open: true
    tty: true
    healthcheck:
      # The dev container just sleeps (devs exec into it) — "healthy" here
      # means pnpm is installed and reachable, not that a server is up.
      # `command -v` (PATH lookup only) instead of `pnpm --version`: the
      # latter runs from /app, whose package.json pins a "packageManager"
      # version, triggering pnpm's auto-install-matching-version feature
      # (a real network call) on every healthcheck tick — unnecessary and
      # can flake on restricted networks.
      test: ["CMD-SHELL", "command -v pnpm"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pnpm-store:
  node_modules:
